services:
  - type: web
    name: camatis-final-backend
    runtime: python
    repo: https://github.com/SansShr/camatis_final_deploy
    branch: main
    region: singapore
    plan: free
    buildCommand: pip install --upgrade pip setuptools wheel && pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"

  - type: web
    name: camatis-final-frontend
    runtime: node
    repo: https://github.com/SansShr/camatis_final_deploy
    branch: main
    rootDir: camatis-frontend
    region: singapore
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: BACKEND_URL
        value: https://camatis-final-backend.onrender.com
